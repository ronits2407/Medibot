name: MediBot CI/CD & Continuous Safety Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Static Analysis, Dependency Verification & Type Safety
  # -------------------------------------------------------------
  typecheck-and-lint:
    name: Typecheck & Static Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm package manager
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Compiler Check
        run: pnpm exec tsc --noEmit

  # -------------------------------------------------------------
  # Job 2: Continuous Prescription Guard Safety Evaluation Gate
  # Fail-Closed Rule 0: Fail the entire pipeline if A1 < 100%
  # -------------------------------------------------------------
  safety-eval-gate:
    name: Prescription Guard Safety Gate (Rubric A1 & A2)
    needs: typecheck-and-lint
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm package manager
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Deterministic Safety & Adversarial Benchmark
        run: |
          pnpm exec tsx eval/run.ts

  # -------------------------------------------------------------
  # Job 3: Multi-Stage Docker Container Build Verification
  # Validates standalone container image deployment
  # -------------------------------------------------------------
  docker-build:
    name: Docker Containerization Build Check
    needs: typecheck-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker standalone container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: medibot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # Job 4: Automated LaTeX Technical Documentation Compilation
  # Compiles publication-grade PDF and attaches workflow artifact
  # -------------------------------------------------------------
  compile-latex-docs:
    name: Compile LaTeX Technical Documentation
    needs: typecheck-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile LaTeX Technical Whitepaper
        uses: dante-ev/latex-action@v0.2.0
        with:
          root_file: main.tex
          working_directory: docs/technical-report
          compiler: pdflatex
          args: -interaction=nonstopmode -halt-on-error

      - name: Upload Compiled PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediBot-Hackathon-Technical-Documentation
          path: docs/technical-report/main.pdf
          retention-days: 30
